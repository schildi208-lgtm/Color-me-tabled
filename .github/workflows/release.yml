name: Release

# Erstellt beim Push eines Tags (z. B. 0.1.0) ein GitHub-Release mit
# main.js, manifest.json und styles.css – den Dateien für die manuelle Installation.
on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: |
          npm install
          npm test
          npm run build

      - name: Release erstellen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title="$tag" --generate-notes \
            main.js manifest.json styles.css
